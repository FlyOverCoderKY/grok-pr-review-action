name: "Grok PR Review"
description: >-
  xAI Grok pull request reviews with a full-PR first pass or a latest-commit
  follow-up. Authenticates with XAI_API_KEY against api.x.ai only.
author: "Nathan / RetireGolden, LLC"
branding:
  icon: "eye"
  color: "purple"

inputs:
  github_token:
    description: "Token used to read the PR and post comments/reviews."
    required: false
    default: ${{ github.token }}
  github_timeout_seconds:
    description: "Timeout for each GitHub CLI operation (1-600 seconds)."
    required: false
    default: "120"
  pr_number:
    description: "PR number to review. Defaults to the PR that triggered the workflow."
    required: false
    default: ""
  model:
    description: "xAI model id (default grok-4.6)."
    required: false
    default: "grok-4.6"
  effort:
    description: "Reasoning effort: low | medium | high | xhigh. Empty = CLI default."
    required: false
    default: ""
  max_turns:
    description: "Maximum agentic turns for the headless grok run."
    required: false
    default: "50"
  fail_on:
    description: "Finding policy: never | bugs | any. Operational errors always fail."
    required: false
    default: "never"
  roast_level:
    description: "Public comment tone: professional | playful | savage | diabolical."
    required: false
    default: "professional"
  allow_unprofessional_tone:
    description: "Required opt-in for savage or diabolical public-comment tones."
    required: false
    default: "false"
  custom_instructions:
    description: "Extra prompt instructions (max 16,000 UTF-8 bytes; do not include secrets)."
    required: false
    default: ""
  status_comments:
    description: "Post/update a live status comment on the PR."
    required: false
    default: "true"
  max_diff_kb:
    description: "Maximum diff size (KB) embedded in the prompt before truncation."
    required: false
    default: "300"
  # One invocation = one review. Every trigger for the same repo/PR must use
  # one caller-level concurrency group with cancel-in-progress: false. The
  # in-action same-SHA checks are defense-in-depth, not an atomic lock.
  review_scope:
    description: >-
      Diff to embed: full-pr (gh pr diff) or latest-commit (only the new
      work on this push). A verify history proven non-linear by GitHub is
      visibly reset to a fresh full-PR round 1; operational compare failures
      fail closed. Initial rounds require full-pr.
    required: false
    default: "full-pr"
  review_mode:
    description: >-
      Loop position: auto (opened = exhaustive initial round, synchronize =
      fix-verification round), or force initial / verify.
    required: false
    default: "auto"
  severity_schedule:
    description: >-
      Comma-separated severity floor per round (last entry repeats). The
      default nit,risk,bug reports everything in round 1, bugs and risks in
      round 2, and bugs only from round 3 on.
    required: false
    default: "nit,risk,bug"
  verify_model:
    description: "Optional cheaper model for verify rounds (defaults to model)."
    required: false
    default: ""
  verify_effort:
    description: "Optional effort override for verify rounds (defaults to effort)."
    required: false
    default: ""
  verify_escalation_lines:
    description: >-
      A verify-round push whose diff changes more lines than this gets a
      full-severity review with the primary model instead of a
      fix-verification pass.
    required: false
    default: "500"
  bot_login:
    description: >-
      GitHub login this action posts reviews as. Loop-ledger state is only
      trusted from reviews authored by this identity. Change it when
      github_token is a PAT or GitHub App token.
    required: false
    default: "github-actions[bot]"
  force_review:
    description: >-
      Bypass same-commit duplicate protection for an intentional rerun.
      Defaults to false; set true only for an explicit manual re-review.
    required: false
    default: "false"

outputs:
  verdict:
    description: "Review verdict: clean | issues | partial | error"
    value: ${{ steps.finish.outputs.verdict || steps.preflight.outputs.verdict }}
  issue_count:
    description: "Open findings after this round (carried-over plus new)."
    value: ${{ steps.finish.outputs.issue_count || steps.preflight.outputs.issue_count }}
  bug_count:
    description: "Open bug-severity findings after this round."
    value: ${{ steps.finish.outputs.bug_count || steps.preflight.outputs.bug_count }}
  round:
    description: "Review-loop round number this run performed."
    value: ${{ steps.finish.outputs.round || steps.preflight.outputs.round }}
  review_url:
    description: "URL of the posted GitHub review or incomplete-review comment."
    value: ${{ steps.finish.outputs.review_url || steps.preflight.outputs.review_url }}

runs:
  using: "composite"
  steps:
    - name: Prepare workdirs
      id: dirs
      shell: bash
      run: |
        WORK="$(mktemp -d "$RUNNER_TEMP/grok-pr-review.XXXXXX")"
        mkdir -p "$WORK/grok-home" "$WORK/bin"
        echo "work=$WORK" >> "$GITHUB_OUTPUT"
        echo "grok_home=$WORK/grok-home" >> "$GITHUB_OUTPUT"

    - name: Validate inputs
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        MAX_TURNS: ${{ inputs.max_turns }}
        FAIL_ON: ${{ inputs.fail_on }}
        ROAST_LEVEL: ${{ inputs.roast_level }}
        CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions }}
        ALLOW_UNPROFESSIONAL_TONE: ${{ inputs.allow_unprofessional_tone }}
        STATUS_COMMENTS: ${{ inputs.status_comments }}
        MAX_DIFF_KB: ${{ inputs.max_diff_kb }}
        REVIEW_SCOPE: ${{ inputs.review_scope }}
        GITHUB_TIMEOUT_SECONDS: ${{ inputs.github_timeout_seconds }}
        REVIEW_MODE: ${{ inputs.review_mode }}
        SEVERITY_SCHEDULE: ${{ inputs.severity_schedule }}
        VERIFY_MODEL: ${{ inputs.verify_model }}
        VERIFY_EFFORT: ${{ inputs.verify_effort }}
        VERIFY_ESCALATION_LINES: ${{ inputs.verify_escalation_lines }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        FORCE_REVIEW: ${{ inputs.force_review }}
      run: python3 -m grok_pr_review validate-inputs

    - name: Check for an existing same-commit verdict
      id: preflight
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        WORK: ${{ steps.dirs.outputs.work }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        GITHUB_TIMEOUT_SECONDS: ${{ inputs.github_timeout_seconds }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        FORCE_REVIEW: ${{ inputs.force_review }}
        FAIL_ON: ${{ inputs.fail_on }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python3 -m grok_pr_review preflight

    - name: Require XAI_API_KEY
      if: ${{ steps.preflight.outputs.skip != 'true' }}
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
      run: python3 -m grok_pr_review check-auth

    - name: Install Grok CLI
      if: ${{ steps.preflight.outputs.skip != 'true' }}
      shell: bash
      env:
        WORK: ${{ steps.dirs.outputs.work }}
      run: bash "${{ github.action_path }}/scripts/install-grok.sh" "$WORK"

    - name: Write Grok config.toml
      if: ${{ steps.preflight.outputs.skip != 'true' }}
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        GROK_HOME: ${{ steps.dirs.outputs.grok_home }}
        MODEL: ${{ inputs.model }}
        VERIFY_MODEL: ${{ inputs.verify_model }}
      run: python3 -m grok_pr_review write-config

    - name: Collect PR context
      id: ctx
      if: ${{ steps.preflight.outputs.skip != 'true' }}
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        WORK: ${{ steps.dirs.outputs.work }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        REVIEW_SCOPE: ${{ inputs.review_scope }}
        MAX_DIFF_KB: ${{ inputs.max_diff_kb }}
        EVENT_BEFORE: ${{ github.event.before }}
        EVENT_AFTER: ${{ github.event.after }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GITHUB_TIMEOUT_SECONDS: ${{ inputs.github_timeout_seconds }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EVENT_ACTION: ${{ github.event.action }}
        REVIEW_MODE: ${{ inputs.review_mode }}
        SEVERITY_SCHEDULE: ${{ inputs.severity_schedule }}
        VERIFY_MODEL: ${{ inputs.verify_model }}
        VERIFY_EFFORT: ${{ inputs.verify_effort }}
        VERIFY_ESCALATION_LINES: ${{ inputs.verify_escalation_lines }}
        BOT_LOGIN: ${{ inputs.bot_login }}
      run: python3 -m grok_pr_review collect

    - name: Prepare isolated review workspace
      if: ${{ steps.preflight.outputs.skip != 'true' }}
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        WORK: ${{ steps.dirs.outputs.work }}
        SOURCE_WORKSPACE: ${{ github.workspace }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        GITHUB_TIMEOUT_SECONDS: ${{ inputs.github_timeout_seconds }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python3 -m grok_pr_review prepare-workspace

    - name: Post status comment
      if: ${{ steps.preflight.outputs.skip != 'true' }}
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        WORK: ${{ steps.dirs.outputs.work }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        REVIEW_SCOPE: ${{ inputs.review_scope }}
        MODEL: ${{ inputs.model }}
        STATUS_COMMENTS: ${{ inputs.status_comments }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GITHUB_TIMEOUT_SECONDS: ${{ inputs.github_timeout_seconds }}
      run: python3 -m grok_pr_review start-status

    - name: Build prompt
      if: ${{ steps.preflight.outputs.skip != 'true' }}
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        WORK: ${{ steps.dirs.outputs.work }}
        REVIEW_SCOPE: ${{ inputs.review_scope }}
        MAX_DIFF_KB: ${{ inputs.max_diff_kb }}
        ROAST_LEVEL: ${{ inputs.roast_level }}
        CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions }}
        ALLOW_UNPROFESSIONAL_TONE: ${{ inputs.allow_unprofessional_tone }}
      run: python3 -m grok_pr_review prompt

    - name: Run Grok review
      if: ${{ steps.preflight.outputs.skip != 'true' }}
      shell: bash
      env:
        GROK_HOME: ${{ steps.dirs.outputs.grok_home }}
        WORK: ${{ steps.dirs.outputs.work }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        MAX_TURNS: ${{ inputs.max_turns }}
        GROK_DISABLE_AUTOUPDATER: "1"
      run: |
        if [ -s "$WORK/model-override" ]; then MODEL="$(cat "$WORK/model-override")"; fi
        if [ -s "$WORK/effort-override" ]; then EFFORT="$(cat "$WORK/effort-override")"; fi
        export MODEL EFFORT
        bash "${{ github.action_path }}/scripts/run-grok.sh" \
          "$WORK/bin/grok" \
          "$WORK/prompt.md" \
          "$WORK/workspace" \
          "$WORK/grok-output.json" \
          "$WORK/grok-stderr.log" \
          "$WORK/grok-exit"

    - name: Post review
      id: finish
      if: ${{ steps.preflight.outputs.skip != 'true' }}
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        WORK: ${{ steps.dirs.outputs.work }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        REVIEW_SCOPE: ${{ inputs.review_scope }}
        MODEL: ${{ inputs.model }}
        FAIL_ON: ${{ inputs.fail_on }}
        STATUS_COMMENTS: ${{ inputs.status_comments }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GITHUB_TIMEOUT_SECONDS: ${{ inputs.github_timeout_seconds }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        FORCE_REVIEW: ${{ inputs.force_review }}
      run: python3 -m grok_pr_review finish

    - name: Cleanup temporary files
      if: ${{ always() }}
      shell: bash
      env:
        WORK: ${{ steps.dirs.outputs.work }}
      run: bash "${{ github.action_path }}/scripts/cleanup-workdir.sh" "$WORK" "$RUNNER_TEMP"
