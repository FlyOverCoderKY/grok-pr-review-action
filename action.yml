name: "Grok PR Review"
description: >-
  xAI Grok pull request reviews with a full-PR first pass or a latest-commit
  follow-up. Authenticates with XAI_API_KEY against api.x.ai only.
author: "Nathan / RetireGolden, LLC"
branding:
  icon: "eye"
  color: "purple"

inputs:
  github_token:
    description: "Token used to read the PR and post comments/reviews."
    required: false
    default: ${{ github.token }}
  pr_number:
    description: "PR number to review. Defaults to the PR that triggered the workflow."
    required: false
    default: ""
  model:
    description: "xAI model id (default grok-4.6)."
    required: false
    default: "grok-4.6"
  effort:
    description: "Reasoning effort: low | medium | high | xhigh. Empty = CLI default."
    required: false
    default: ""
  max_turns:
    description: "Maximum agentic turns for the headless grok run."
    required: false
    default: "50"
  fail_on:
    description: "When to fail the check: never | bugs | any."
    required: false
    default: "never"
  roast_level:
    description: "Comment tone: professional | playful | savage | diabolical."
    required: false
    default: "professional"
  custom_instructions:
    description: "Extra review instructions injected into the prompt."
    required: false
    default: ""
  status_comments:
    description: "Post/update a live status comment on the PR."
    required: false
    default: "true"
  max_diff_kb:
    description: "Maximum diff size (KB) embedded in the prompt before truncation."
    required: false
    default: "300"
  review_scope:
    description: >-
      Diff to embed: full-pr (gh pr diff) or latest-commit (only the new
      work on this push). latest-commit never silently falls back to the
      full PR diff.
    required: false
    default: "full-pr"

outputs:
  verdict:
    description: "Review verdict: clean | issues | partial | error"
    value: ${{ steps.finish.outputs.verdict }}
  issue_count:
    description: "Total number of issues found."
    value: ${{ steps.finish.outputs.issue_count }}
  bug_count:
    description: "Number of bug-severity issues found."
    value: ${{ steps.finish.outputs.bug_count }}
  review_url:
    description: "URL of the posted GitHub review or incomplete-review comment."
    value: ${{ steps.finish.outputs.review_url }}

runs:
  using: "composite"
  steps:
    - name: Prepare workdirs
      id: dirs
      shell: bash
      run: |
        WORK="$(mktemp -d "$RUNNER_TEMP/grok-pr-review.XXXXXX")"
        mkdir -p "$WORK/grok-home" "$WORK/bin"
        echo "work=$WORK" >> "$GITHUB_OUTPUT"
        echo "grok_home=$WORK/grok-home" >> "$GITHUB_OUTPUT"

    - name: Require XAI_API_KEY
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
      run: python3 -m grok_pr_review check-auth

    - name: Install Grok CLI
      shell: bash
      env:
        WORK: ${{ steps.dirs.outputs.work }}
      run: |
        GROK_VERSION="1.0.5"
        if [ "$(uname -s)" != "Linux" ]; then
          echo "This action currently supports Linux runners only." >&2
          exit 1
        fi
        case "$(uname -m)" in
          x86_64|amd64)
            GROK_ARCH="x86_64"
            GROK_SHA256="9ba87444e1819e8f6104adbbf4676a870c204380aa5c3e1c38a926c4ea677238"
            ;;
          arm64|aarch64)
            GROK_ARCH="aarch64"
            GROK_SHA256="1c1fe67d7c35497fb09f44a451f57acc3787add4c9aea2c56f5c7c75dc5ffcf1"
            ;;
          *)
            echo "Unsupported Linux architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac
        GROK_DOWNLOAD="$WORK/bin/grok.download"
        curl --proto '=https' --tlsv1.2 --retry 3 -fsSL \
          "https://x.ai/cli/grok-${GROK_VERSION}-linux-${GROK_ARCH}" \
          -o "$GROK_DOWNLOAD"
        echo "$GROK_SHA256  $GROK_DOWNLOAD" | sha256sum --check --status
        mv "$GROK_DOWNLOAD" "$WORK/bin/grok"
        chmod 0755 "$WORK/bin/grok"
        "$WORK/bin/grok" --version

    - name: Write Grok config.toml
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        GROK_HOME: ${{ steps.dirs.outputs.grok_home }}
        MODEL: ${{ inputs.model }}
      run: python3 -m grok_pr_review write-config

    - name: Collect PR context
      id: ctx
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        WORK: ${{ steps.dirs.outputs.work }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        REVIEW_SCOPE: ${{ inputs.review_scope }}
        MAX_DIFF_KB: ${{ inputs.max_diff_kb }}
        EVENT_BEFORE: ${{ github.event.before }}
        EVENT_AFTER: ${{ github.event.after }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: python3 -m grok_pr_review collect

    - name: Prepare isolated review workspace
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        WORK: ${{ steps.dirs.outputs.work }}
        SOURCE_WORKSPACE: ${{ github.workspace }}
      run: python3 -m grok_pr_review prepare-workspace

    - name: Post status comment
      if: ${{ inputs.status_comments == 'true' }}
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        WORK: ${{ steps.dirs.outputs.work }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        REVIEW_SCOPE: ${{ inputs.review_scope }}
        MODEL: ${{ inputs.model }}
        STATUS_COMMENTS: ${{ inputs.status_comments }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python3 -m grok_pr_review start-status

    - name: Build prompt
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        WORK: ${{ steps.dirs.outputs.work }}
        REVIEW_SCOPE: ${{ inputs.review_scope }}
        MAX_DIFF_KB: ${{ inputs.max_diff_kb }}
        ROAST_LEVEL: ${{ inputs.roast_level }}
        CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions }}
      run: python3 -m grok_pr_review prompt

    - name: Run Grok review
      shell: bash
      env:
        GROK_HOME: ${{ steps.dirs.outputs.grok_home }}
        WORK: ${{ steps.dirs.outputs.work }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        MAX_TURNS: ${{ inputs.max_turns }}
        GROK_DISABLE_AUTOUPDATER: "1"
      run: |
        EXTRA_ARGS=()
        if [ -n "$MODEL" ]; then
          EXTRA_ARGS+=(-m "$MODEL")
        fi
        if [ -n "$EFFORT" ]; then
          EXTRA_ARGS+=(--effort "$EFFORT")
        fi

        set +e
        "$WORK/bin/grok" --prompt-file "$WORK/prompt.md" \
          --output-format json \
          --yolo \
          --sandbox strict \
          --no-subagents \
          --no-memory \
          --disable-web-search \
          --tools "read_file,grep,list_dir" \
          --disallowed-tools "run_terminal_cmd,web_search,web_fetch,search_replace,Agent" \
          --max-turns "$MAX_TURNS" \
          --no-auto-update \
          --cwd "$WORK/workspace" \
          "${EXTRA_ARGS[@]}" \
          > "$WORK/grok-output.json" \
          2> "$WORK/grok-stderr.log"
        echo "$?" > "$WORK/grok-exit"
        set -e

        echo "grok exit code: $(cat "$WORK/grok-exit")"
        echo "--- last stderr lines ---"
        tail -n 30 "$WORK/grok-stderr.log" || true

    - name: Post review
      id: finish
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        WORK: ${{ steps.dirs.outputs.work }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        REVIEW_SCOPE: ${{ inputs.review_scope }}
        MODEL: ${{ inputs.model }}
        FAIL_ON: ${{ inputs.fail_on }}
        STATUS_COMMENTS: ${{ inputs.status_comments }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python3 -m grok_pr_review finish

    - name: Cleanup temporary files
      if: ${{ always() }}
      shell: bash
      env:
        WORK: ${{ steps.dirs.outputs.work }}
      run: |
        case "${WORK:-}" in
          "$RUNNER_TEMP"/grok-pr-review.*) rm -rf -- "$WORK" ;;
          *) echo "Refusing to clean unexpected path: ${WORK:-<empty>}" >&2; exit 1 ;;
        esac
