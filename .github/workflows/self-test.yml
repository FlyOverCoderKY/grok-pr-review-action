name: Self-test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python3 -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Typecheck
        run: mypy src

      - name: Unit tests
        run: pytest -q
