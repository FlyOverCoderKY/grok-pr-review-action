name: Self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  action-boundary:
    name: Action boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate action metadata and workflows
        run: |
          bash scripts/install-action-validator.sh "$RUNNER_TEMP/action-validator"
          "$RUNNER_TEMP/action-validator" action.yml
          "$RUNNER_TEMP/action-validator" .github/workflows/self-test.yml
          "$RUNNER_TEMP/action-validator" .github/workflows/verify-grok-release.yml

      - name: Run actionlint
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          -w /repo
          "$ACTIONLINT_IMAGE"
          -no-color

      - name: Run shellcheck
        run: shellcheck scripts/*.sh tests/integration/*.sh

      - name: Exercise action scripts with a stub Grok executable
        run: bash tests/integration/test_action_scripts.sh

  self-test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python3 -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Typecheck
        run: mypy src

      - name: Security lint
        run: bandit -q -r src

      - name: Unit tests
        run: coverage run --source=src/grok_pr_review -m pytest -q

      - name: Coverage
        run: coverage report --fail-under=80
