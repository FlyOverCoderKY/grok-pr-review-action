[project]
name = "grok-pr-review-action"
version = "0.1.0"
description = "Public GitHub Action for xAI Grok pull request reviews with full-PR and latest-commit scopes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.15"
authors = [{ name = "Nathan / RetireGolden, LLC" }]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "coverage==7.15.4",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["grok_pr_review"]
